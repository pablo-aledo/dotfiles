[project]
name = "abc-autoresearch"
version = "0.2.0"
description = "Investigación autónoma de modelos de lenguaje para música en formato ABC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mido>=1.3.3",
    "numpy>=2.2.6",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "torch==2.9.1",
]

[project.optional-dependencies]
# Solo para abc_conditioned.py (embeddings de lyrics; descarga ~470 MB la primera vez)
conditioned = [
    "sentence-transformers>=3.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
